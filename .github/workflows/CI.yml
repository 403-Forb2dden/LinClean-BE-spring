name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
